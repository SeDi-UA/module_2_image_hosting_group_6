<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartUploader</title>
    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <section class="upload__intro">
        <h2 class="upload__title">Upload Photos</h2>
        <p class="upload__description">Upload selfies, memes, or any fun pictures here.</p>
    </section>
    <nav class="nav__tabs">
        <button class="nav__tab" id="upload-tab-btn">Upload</button>
        <button class="nav__tab" id="images-tab-btn">Images</button>
    </nav>
    <section class="upload__form">
        <div class="upload__dropzone">
            <input type="file" id="file-upload" accept="image/*" style="display: none;" multiple>

            <div id="dropzone-default">
                <div class="upload__icon">
                    <img src="../static/img/icon/feather_upload-cloud.png" alt="icon">
                </div>
                <p class="upload__prompt">Click here to browse your file or drag and drop here</p>
                <p class="upload__info">Only support .jpg, .png and gif. <br>
                    Maximum file size is 5MB. Max 10 files.</p>
            </div>

            <div id="dropzone-loading" class="dropzone-status" style="display: none;">
                <div class="spinner"></div>
                <p class="upload__prompt">Uploading your files, please wait...</p>
            </div>

            <div id="dropzone-result" class="dropzone-status" style="display: none;">
                <p id="dropzone-result-text" class="upload__prompt"></p>
            </div>
        </div>
        <div class="upload__container" id="uploaded-files-container" style="display: none;">
            <div class="upload__group">
                <h2 class="upload__title-current">Current Uploads</h2>
                <div id="links-list"></div>
            </div>
        </div>
    </section>
    <section id="file-list-wrapper">
    </section>
</body>
<script src="../static/js/upload.js"></script>

</html>
