#docker-compose.yml
services:
  app:
    build: .
    container_name: python_app
    ports:
      - "8000:8000"
    volumes:
      - images_data:/app/images
      - logs_data:/app/logs
    environment:
      - UPLOAD_DIR=/app/images
      - LOG_DIR=/app/logs
      - LOG_FILE_PATH=/app/logs/server.log
    restart: always

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_server
    ports:
      - "8080:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - images_data:/images:ro
      - ./src/static:/app/src/static:ro
      - ./src/form:/app/src/form:ro
    depends_on:
      - app
    restart: always

volumes:
  images_data:
  logs_data: